name: Validate

on:
  push:
  pull_request:
  workflow_call:   # lets the release workflow require a green run on the tagged commit
  schedule:
    - cron: "0 5 * * 1"   # weekly: catches Home Assistant / HACS rule changes

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

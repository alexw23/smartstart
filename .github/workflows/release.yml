name: Release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) and this publishes a
# GitHub release with generated notes. HACS installs the tagged source, so no
# zip is needed. The tag must match the version in manifest.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/smartstart/manifest.json'))['version'])")
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${manifest}" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" --prerelease
